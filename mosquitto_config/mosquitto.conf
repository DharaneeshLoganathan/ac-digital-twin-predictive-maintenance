# ==============================================================================
# Mosquitto MQTT Configuration for AC Digital Twin
# Place this file in your Mosquitto installation directory (e.g., C:\Program Files\mosquitto\mosquitto.conf)
# ==============================================================================

# Listen on port 1883 on all network interfaces (allows ESP32 on Wi-Fi to connect)
listener 1883 0.0.0.0

# Allow anonymous connections for local development (no username/password required)
allow_anonymous true

# Enable persistent storage of subscriptions and retained messages
persistence true

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
